# Reference nginx configuration for serving the FashionSaaS Angular storefront.
#
# STATUS: Reference only — not wired into any deployment pipeline yet.
# Full containerized/cloud deployment (Docker image, Azure hosting, CI/CD)
# is Phase 8 scope. This file documents the minimum server behavior the
# storefront needs from any static host: SPA fallback routing, gzip, and
# long-lived caching for hashed build assets.
#
# Usage: copy the `dist/fashionsaas-storefront/browser` build output to
# /usr/share/nginx/html (or bind-mount it) and point a server block at this
# config, e.g. in a future Dockerfile:
#   COPY dist/fashionsaas-storefront/browser /usr/share/nginx/html
#   COPY deploy/nginx.conf /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip compression for text-based assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Angular build output is content-hashed (outputHashing: all), so these
    # files are safe to cache aggressively and immutably.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, since it references the current
    # hashed bundle names and is the entry point for every client route.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: the app owns client-side routing (Angular Router with
    # routes like /products, /cart, /checkout, /account). Any path that
    # doesn't match a real file must fall back to index.html so deep links
    # and hard refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
