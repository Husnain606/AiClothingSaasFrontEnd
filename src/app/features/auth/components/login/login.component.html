<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card login-card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Login</h4>
        </div>
        <div class="card-body">
          <!-- Error Alert -->
          <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ errorMessage }}
            <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
          </div>

          <!-- Login Form -->
          <form *ngIf="step === 'credentials'" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Email Field -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                formControlName="email"
                [class.is-invalid]="email?.invalid && email?.touched"
                placeholder="Enter your email"
              />
              <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
                <div *ngIf="email?.errors?.['required']">Email is required</div>
                <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                formControlName="password"
                [class.is-invalid]="password?.invalid && password?.touched"
                placeholder="Enter your password"
              />
              <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
                <div *ngIf="password?.errors?.['required']">Password is required</div>
                <div *ngIf="password?.errors?.['minlength']">
                  Password must be at least 6 characters
                </div>
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="loginForm.invalid || isLoading"
            >
              <span *ngIf="!isLoading">Login</span>
              <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Logging in...
              </span>
            </button>
          </form>

          <!-- MFA Challenge Form -->
          <form *ngIf="step === 'mfa'" (ngSubmit)="onSubmitMfa()" aria-label="Two-factor verification">
            <p class="text-muted">Enter the 6-digit code from your authenticator app.</p>
            <div class="mb-3">
              <label for="mfaCode" class="form-label">Verification code</label>
              <input
                id="mfaCode"
                name="mfaCode"
                type="text"
                inputmode="numeric"
                maxlength="6"
                class="form-control"
                [class.is-invalid]="mfaError"
                [(ngModel)]="mfaCode"
                [ngModelOptions]="{standalone: true}"
                autocomplete="one-time-code"
                required
              />
              <div class="invalid-feedback" *ngIf="mfaError">{{ mfaError }}</div>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="mfaSubmitting">
              {{ mfaSubmitting ? 'Verifying…' : 'Verify' }}
            </button>
            <button type="button" class="btn btn-link w-100" (click)="onBackToCredentials()">
              Back to sign in
            </button>
          </form>

          <!-- Register Link -->
          <div class="text-center mt-3" *ngIf="step === 'credentials'">
            <p>
              Don't have an account?
              <a routerLink="/register" class="text-primary">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
