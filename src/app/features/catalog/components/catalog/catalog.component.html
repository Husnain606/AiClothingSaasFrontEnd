<!-- Search Bar (Top) -->
<div class="search-section">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <h1 class="mb-3">Browse Products</h1>
        <app-product-search
          (searchSubmit)="onSearch($event)"
          (suggestionsSelected)="onSuggestionsSelected($event)"
        ></app-product-search>
      </div>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="catalog-content">
  <div class="container-fluid">
    <div class="row g-4">
      <!-- Left Sidebar: Categories -->
      <div class="col-12 col-lg-3">
        <div class="sticky-lg-top" style="top: 20px">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom">
              <h5 class="mb-0">
                <i class="bi bi-funnel me-2"></i>Categories
              </h5>
            </div>
            <div class="card-body p-0">
              <app-category-list
                (selectedCategory)="onCategorySelected($event)"
              ></app-category-list>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Content: Products -->
      <div class="col-12 col-lg-9">
        <!-- Selected Filter Display -->
        <div
          *ngIf="(selectedCategory$ | async) as category"
          class="alert alert-info alert-dismissible fade show mb-3"
          role="alert"
        >
          <i class="bi bi-tag me-2"></i>
          Showing products in: <strong>{{ category.name }}</strong>
          <button
            type="button"
            class="btn-close"
            (click)="onCategorySelected(null)"
          ></button>
        </div>

        <!-- Search Filter Display -->
        <div
          *ngIf="(searchQuery$ | async) as query"
          [hidden]="!query"
          class="alert alert-info alert-dismissible fade show mb-3"
          role="alert"
        >
          <i class="bi bi-search me-2"></i>
          Search results for: <strong>{{ query }}</strong>
          <button
            type="button"
            class="btn-close"
            (click)="onSearch('')"
          ></button>
        </div>

        <!-- Products Grid -->
        <app-product-list
          [products]="(products$ | async) || []"
          [loading]="(loading$ | async) || false"
          [error]="(error$ | async)"
          [currentPage]="(currentPage$ | async) || 1"
          [totalPages]="(totalPages$ | async) || 1"
          [selectedCategoryId]="(selectedCategory$ | async)?.id"
          (pageChange)="onPageChange($event)"
          (addToCart)="onAddToCart($event)"
        ></app-product-list>
      </div>
    </div>
  </div>
</div>
