<div class="container-lg mt-5 mb-5">
  <h1 class="mb-4">Shopping Cart</h1>

  <div *ngIf="(cart$ | async) as cart" class="row g-4">
    <div class="col-lg-8">
      <app-cart-list
        [items]="cart.items"
        (removeItem)="onRemoveItem($event)"
        (updateQuantity)="onUpdateQuantity($event.productId, $event.quantity)"
      >
      </app-cart-list>
    </div>

    <div class="col-lg-4">
      <app-cart-summary
        [cart]="cart"
        (clearCart)="onClearCart()"
        (checkout)="onCheckout()"
      >
      </app-cart-summary>
    </div>
  </div>
</div>
