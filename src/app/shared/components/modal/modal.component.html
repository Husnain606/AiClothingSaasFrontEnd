<div *ngIf="isVisible" class="modal-overlay">
  <div class="modal-dialog" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-content">
      <!-- Modal Header -->
      <div [class]="'modal-header ' + getHeaderClass()">
        <div class="modal-title-wrapper">
          <i [class]="'modal-icon ' + getIconClass()"></i>
          <h5 id="modalTitle" class="modal-title">{{ title }}</h5>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <p class="mb-0">{{ content }}</p>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()">
          {{ cancelText }}
        </button>
        <button
          type="button"
          [class]="'btn ' + getConfirmButtonClass()"
          (click)="onConfirm()">
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
