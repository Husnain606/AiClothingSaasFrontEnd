<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom shadow-sm">
  <div class="container">
    <!-- Brand/Logo -->
    <a
      class="navbar-brand fw-bold text-primary"
      routerLink="/home"
      (click)="closeNavbar()">
      <i class="bi bi-shop me-2"></i>FashionSaaS
    </a>

    <!-- Mobile hamburger button -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleNavbar()"
      [attr.aria-expanded]="isNavbarOpen"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar content -->
    <div
      class="collapse navbar-collapse"
      [class.show]="isNavbarOpen">
      <ul class="navbar-nav ms-auto">
        <!-- Catalog link -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/catalog"
            (click)="closeNavbar()">
            Catalog
          </a>
        </li>

        <!-- Cart link with badge -->
        <li class="nav-item">
          <a
            class="nav-link position-relative"
            routerLink="/cart"
            (click)="closeNavbar()">
            <i class="bi bi-bag-check"></i> Cart
            <span
              *ngIf="cartItemCount$ | async as count"
              [class]="count > 0 ? 'badge bg-danger position-absolute top-0 start-100 translate-middle' : ''">
              {{ count > 0 ? count : '' }}
            </span>
          </a>
        </li>

        <!-- Authentication links -->
        <ng-container *ngIf="!(isLoggedIn$ | async)">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/login"
              (click)="closeNavbar()">
              Login
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/register"
              (click)="closeNavbar()">
              Register
            </a>
          </li>
        </ng-container>

        <!-- User dropdown menu -->
        <ng-container *ngIf="isLoggedIn$ | async">
          <li class="nav-item dropdown">
            <button
              class="nav-link dropdown-toggle"
              type="button"
              id="navbarDropdown"
              (click)="toggleUserMenu()"
              [attr.aria-expanded]="isUserMenuOpen">
              <i class="bi bi-person-circle"></i>
              {{ (currentUser$ | async)?.firstName || 'Account' }}
            </button>
            <ul
              class="dropdown-menu dropdown-menu-end"
              [class.show]="isUserMenuOpen"
              aria-labelledby="navbarDropdown">
              <li>
                <a
                  class="dropdown-item"
                  routerLink="/account/profile"
                  (click)="closeNavbar()">
                  <i class="bi bi-person me-2"></i>Profile
                </a>
              </li>
              <li>
                <a
                  class="dropdown-item"
                  routerLink="/account/orders"
                  (click)="closeNavbar()">
                  <i class="bi bi-bag me-2"></i>Orders
                </a>
              </li>
              <li>
                <a
                  class="dropdown-item"
                  routerLink="/account/addresses"
                  (click)="closeNavbar()">
                  <i class="bi bi-geo-alt me-2"></i>Addresses
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button
                  type="button"
                  class="dropdown-item text-danger"
                  (click)="onLogout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
