<h1 class="h4 mb-3">Login attempts</h1>
<form class="d-flex gap-2 mb-3" (ngSubmit)="onSearch()">
  <input
    class="form-control form-control-sm w-auto"
    placeholder="Email (required)"
    name="email"
    [(ngModel)]="emailInput"
    required />
  <button type="submit" class="btn btn-sm btn-primary" [disabled]="!canSearch">Search</button>
</form>
<p *ngIf="!canSearch && !searched" class="text-muted small">Enter an email address to search login attempts.</p>
<app-data-table
  *ngIf="searched"
  [columns]="columns"
  [rows]="attempts"
  [totalCount]="totalCount"
  [pageNumber]="pageNumber"
  [pageSize]="pageSize"
  [sortKey]="null"
  sortDirection="asc"
  [loading]="loading"
  emptyMessage="No login attempts found."
  (pageChange)="onPageChange($event)">
  <ng-template #customCell let-row="row" let-column="column">
    <ng-container [ngSwitch]="column.key">
      <span *ngSwitchCase="'isSuccess'">{{ row.isSuccess ? 'Yes' : 'No' }}</span>
    </ng-container>
  </ng-template>
</app-data-table>
