<h1 class="h4 mb-3">Audit logs</h1>
<app-date-range-picker [range]="range" (rangeChange)="onRangeChange($event)"></app-date-range-picker>
<app-data-table [columns]="columns" [rows]="logs" [totalCount]="totalCount" [pageNumber]="pageNumber"
  [pageSize]="pageSize" [sortKey]="null" sortDirection="asc" [loading]="loading"
  emptyMessage="No audit logs found." (pageChange)="onPageChange($event)">
  <ng-template #customCell let-row="row" let-column="column">
    <ng-container [ngSwitch]="column.key">
      <span *ngSwitchCase="'userId'">{{ row.userId ?? '—' }}</span>
    </ng-container>
  </ng-template>
</app-data-table>
