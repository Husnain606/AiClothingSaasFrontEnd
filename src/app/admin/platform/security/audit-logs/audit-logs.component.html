<h1 class="h4 mb-3">Audit logs</h1>
<app-date-range-picker [range]="range" (rangeChange)="onRangeChange($event)"></app-date-range-picker>
<table class="table table-sm mt-3">
  <thead>
    <tr>
      <th>Date</th>
      <th>User</th>
      <th>Action</th>
      <th>Entity</th>
      <th>IP</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let l of logs">
      <td>{{ l.createdAt | date: 'medium' }}</td>
      <td>{{ l.userId ?? '—' }}</td>
      <td>{{ l.action }}</td>
      <td>{{ l.entityName }}</td>
      <td>{{ l.ipAddress }}</td>
    </tr>
  </tbody>
</table>
