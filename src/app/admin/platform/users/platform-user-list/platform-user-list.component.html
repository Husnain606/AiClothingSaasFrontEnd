<h1 class="h4 mb-3">Platform users</h1>
<table class="table table-sm">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Roles</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of users">
      <td>{{ u.firstName }} {{ u.lastName }}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.roles.join(', ') }}</td>
      <td>{{ u.isActive ? 'Active' : 'Locked' }}</td>
      <td>
        <button class="btn btn-sm btn-outline-warning" *ngIf="!u.isActive" (click)="onUnlock(u)">Unlock</button>
      </td>
    </tr>
  </tbody>
</table>
