<h1 class="h4 mb-3">Platform overview</h1>
<div class="row g-3">
  <div class="col-sm-4"><app-kpi-card label="Tenants" [value]="tenantCount" icon="building"></app-kpi-card></div>
  <div class="col-sm-4">
    <app-kpi-card label="Active subscriptions" [value]="activeSubscriptionCount" icon="receipt"></app-kpi-card>
  </div>
  <div class="col-sm-4">
    <app-kpi-card label="Platform users" [value]="platformUserCount" icon="people-fill"></app-kpi-card>
  </div>
</div>
