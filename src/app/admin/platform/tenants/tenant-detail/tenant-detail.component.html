<ng-container *ngIf="tenant as t">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">{{ t.name }}</h1>
    <button class="btn btn-outline-danger btn-sm" (click)="openDeleteModal()">Delete tenant</button>
  </div>
  <p><strong>Slug:</strong> {{ t.slug }}</p>
  <p><strong>Email:</strong> {{ t.email }}</p>
  <p><strong>Status:</strong> {{ t.isActive ? 'Active' : 'Suspended' }}</p>

  <app-confirm-modal
    [isOpen]="deleteModalOpen"
    title="Delete tenant"
    [message]="'This permanently deletes ' + t.name + ' and all its data. Type the tenant slug to confirm.'"
    confirmLabel="Delete tenant"
    tone="danger"
    [requireTypedConfirmation]="requireTypedConfirmation"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()">
  </app-confirm-modal>
</ng-container>
