<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Tenants</h1>
  <a routerLink="new" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New tenant</a>
</div>

<app-data-table [columns]="columns" [rows]="rows" [totalCount]="totalCount" [pageNumber]="pageNumber"
  [pageSize]="pageSize" [sortKey]="null" sortDirection="asc" [loading]="loading"
  emptyMessage="No tenants found." (pageChange)="onPageChange($event)">
  <ng-template #customCell let-row="row" let-column="column">
    <ng-container [ngSwitch]="column.key">
      <app-status-badge *ngSwitchCase="'isActive'" [status]="row.isActive ? 'active' : 'inactive'"></app-status-badge>
      <ng-container *ngSwitchCase="'id'">
        <a [routerLink]="[row.id]" class="btn btn-sm btn-outline-secondary">Manage</a>
        <button class="btn btn-sm btn-outline-warning" *ngIf="row.isActive" (click)="onSuspend(row)">Suspend</button>
        <button class="btn btn-sm btn-outline-success" *ngIf="!row.isActive" (click)="onActivate(row)">Activate</button>
      </ng-container>
    </ng-container>
  </ng-template>
</app-data-table>
