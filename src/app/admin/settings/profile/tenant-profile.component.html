<h1 class="h4 mb-3">Tenant profile</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="name" class="form-label">Store name</label>
    <input id="name" class="form-control" formControlName="name" />
    <div class="text-danger small" *ngIf="form.controls.name.invalid && form.controls.name.touched">
      Store name is required.
    </div>
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">Contact phone</label>
    <input id="phone" class="form-control" formControlName="phone" />
  </div>
  <div class="mb-3">
    <label for="logoUrl" class="form-label">Logo URL</label>
    <input id="logoUrl" class="form-control" formControlName="logoUrl" />
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
</form>
