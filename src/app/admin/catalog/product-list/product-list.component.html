<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Products</h1>
  <div class="d-flex gap-2">
    <a routerLink="categories" class="btn btn-outline-secondary btn-sm">Categories</a>
    <a routerLink="new" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New product</a>
  </div>
</div>

<input class="form-control form-control-sm mb-3 w-auto" placeholder="Search products"
       (change)="onSearchChange($any($event.target).value)" />

<app-data-table [columns]="columns" [rows]="rows" [totalCount]="totalCount" [pageNumber]="pageNumber"
  [pageSize]="pageSize" [sortKey]="null" sortDirection="asc" [loading]="loading"
  emptyMessage="No products found." (pageChange)="onPageChange($event)">
  <ng-template #customCell let-row="row" let-column="column">
    <ng-container [ngSwitch]="column.key">
      <app-status-badge *ngSwitchCase="'status'" [status]="row.status"></app-status-badge>
      <ng-container *ngSwitchCase="'id'">
        <a [routerLink]="[row.id]" class="btn btn-sm btn-outline-secondary">Edit</a>
        <button class="btn btn-sm btn-outline-success" *ngIf="row.status !== 'Active'" (click)="onPublish(row)">Publish</button>
        <button class="btn btn-sm btn-outline-warning" *ngIf="row.status !== 'Archived'" (click)="onArchive(row)">Archive</button>
        <button class="btn btn-sm btn-outline-danger" (click)="openDeleteModal(row)">Delete</button>
      </ng-container>
    </ng-container>
  </ng-template>
</app-data-table>

<app-confirm-modal
  [isOpen]="deleteModalOpen"
  title="Delete product"
  [message]="'Delete ' + (productPendingDelete?.name ?? '') + '? This cannot be undone.'"
  confirmLabel="Delete"
  tone="danger"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-confirm-modal>
