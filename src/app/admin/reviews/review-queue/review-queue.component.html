<h1 class="h4 mb-3">Review moderation queue</h1>

<app-data-table [columns]="columns" [rows]="rows" [totalCount]="totalCount" [pageNumber]="pageNumber"
  [pageSize]="pageSize" [sortKey]="null" sortDirection="asc" [loading]="loading"
  emptyMessage="No pending reviews." (pageChange)="onPageChange($event)">
  <ng-template #customCell let-row="row" let-column="column">
    <ng-container [ngSwitch]="column.key">
      <ng-container *ngSwitchCase="'id'">
        <button class="btn btn-sm btn-outline-success" (click)="onApprove(row)">Approve</button>
        <button class="btn btn-sm btn-outline-danger" (click)="openRejectModal(row)">Reject</button>
      </ng-container>
    </ng-container>
  </ng-template>
</app-data-table>

<app-confirm-modal
  [isOpen]="rejectModalOpen"
  title="Reject review"
  [message]="'Reject this review (rating ' + (reviewPendingReject?.rating ?? '') + ')? Enter a reason below, then confirm.'"
  confirmLabel="Reject"
  tone="danger"
  [requireReason]="true"
  reasonLabel="Rejection reason"
  (confirmed)="onRejectConfirmed($event)"
  (cancelled)="onRejectCancelled()">
</app-confirm-modal>
