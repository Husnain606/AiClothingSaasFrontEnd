<div class="notification-bell">
  <button
    type="button"
    class="btn btn-sm btn-outline-secondary notification-bell__toggle position-relative"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
    aria-label="Notifications">
    <i class="bi bi-bell"></i>
    <span
      *ngIf="unreadCount > 0"
      class="badge rounded-pill text-bg-danger notification-bell__badge">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div class="notification-bell__backdrop" *ngIf="isOpen" (click)="close()"></div>

  <div class="notification-bell__dropdown" *ngIf="isOpen">
    <div class="notification-bell__header">Notifications</div>
    <div class="notification-bell__empty" *ngIf="!loading && notifications.length === 0">
      No notifications yet.
    </div>
    <ul class="list-unstyled notification-bell__list" *ngIf="notifications.length > 0">
      <li *ngFor="let n of notifications" class="notification-bell__item">
        <div class="notification-bell__title">{{ n.title }}</div>
        <div class="notification-bell__message">{{ n.message }}</div>
      </li>
    </ul>
  </div>
</div>
